# Low-RAM Windows laptops (~8GB physical, small page file).
# hs_err_pid*.log: native OOM in C2 compiler — modest heap + smaller stacks + in-process Kotlin.
# See docs/ANDROID_RELEASE_BUILD_WINDOWS.md
org.gradle.jvmargs=-Xmx1024m -Xms128m -Xss512k -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=64m -XX:HeapBaseMinAddress=2g -XX:CICompilerCount=2 -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# Jetifier is memory-heavy; project uses AndroidX.
android.enableJetifier=false
# Single-worker, non-parallel builds: slower but stable under memory pressure.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.vfs.watch=false
org.gradle.unsafe.watch-fs=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.newDsl=false
# Local release APK testing only (debug-signed). Play upload needs android/key.properties.
allowDebugReleaseSigning=true
# Avoid a second Kotlin JVM (~512MB+) on top of Gradle.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.enabled=false
kotlin.daemon.jvm.options=-Xmx384m,-XX:MaxMetaspaceSize=192m,-Xss512k
# Defaults when building via Gradle; app/build.gradle.kts forces these on FlutterTask too.
tree-shake-icons=false
target-platform=android-arm64
# Flutter PROP "shrink" (FlutterPluginUtils): false skips R8 minify/shrink (needs ~2GB+ heap on this app).
shrink=false
# 8GB RAM: lintVitalAnalyzeRelease Metaspace OOM on Firebase plugins.
android.lint.checkReleaseBuilds=false
# Windows: AAPT2 daemon link crashes under memory pressure (verifyReleaseResources).
android.enableAapt2Daemon=false

# Workaround for intermittent :app:packageDebug failures on Windows (incremental split step).
android.useIncrementalPackaging=false
# Intermittent DNS / slow downloads on Windows (Read timed out, host lookup failures).
systemProp.java.net.preferIPv4Stack=true
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
