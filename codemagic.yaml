# Babyland - iOS TestFlight / App Store builds on Codemagic (no Mac required).
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# One-time Codemagic setup (web UI):
# 1. Sign up at https://codemagic.io and connect this Git repository.
# 2. Team settings -> Integrations -> Developer Portal -> add App Store Connect API key (.p8).
#    The "API key name" you type there MUST match integrations.app_store_connect below (Babyland).
# 3. Select workflow "babyland-ios-testflight" and start a build.

workflows:
  babyland-ios-testflight:
    name: Babyland iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Babyland"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thebabyland
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # Xcode 26 altool cannot map bundle ID → Apple ID. Pass ASC Apple ID explicitly.
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Verify Firebase iOS config
        script: |
          test -f ios/Runner/GoogleService-Info.plist || (
            echo "Missing ios/Runner/GoogleService-Info.plist"
            exit 1
          )
      - name: Set up code signing
        script: |
          # Codemagic injects App Store cert/profile from ios_signing + Developer Portal.
          # Do NOT run fetch-signing-files --create without CERTIFICATE_PRIVATE_KEY.
          xcode-project use-profiles \
            --custom-export-options '{"method":"app-store","destination":"export","signingStyle":"manual"}'
          echo "Generated export options:"
          cat "$HOME/export_options.plist"
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: |
          cd ios
          pod install
          echo "=== Agora / linker hardening check ==="
          # Must NOT use static linkage — that strips Iris FFI and crashes on initialize().
          if grep -q "linkage => :static" Podfile; then
            echo "ERROR: Podfile must not use use_frameworks! :linkage => :static"
            exit 1
          fi
          grep -n "use_frameworks!" Podfile
          grep -n "dynamic_framework\|iris_method_channel\|agora_rtc_engine" Podfile
          grep -n "STRIP_STYLE\|OTHER_LDFLAGS\|force_load\|AgoraRtcKit" Podfile Flutter/Release.xcconfig
          grep -q "iris_method_channel" Podfile
          grep -q "STRIP_STYLE=non-global" Flutter/Release.xcconfig
          grep -q "\-ObjC" Flutter/Release.xcconfig
          grep -q "STRIP_STYLE = non-global" Runner.xcodeproj/project.pbxproj
          grep -q "DEPLOYMENT_POSTPROCESSING = YES" Runner.xcodeproj/project.pbxproj
          grep -q "DEAD_CODE_STRIPPING = NO" Runner.xcodeproj/project.pbxproj
          echo "Linker hardening files OK"
          cd ..
      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --no-tree-shake-icons \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define=API_BASE_URL=http://164.52.197.176/api/v1 \
            --dart-define=API_ROOT_URL=http://164.52.197.176/api \
            --dart-define=FIREBASE_FORCE_RECAPTCHA=false \
            --dart-define=APP_BUILD_TAG=appstore-v3 \
            --dart-define=FIREBASE_APP_CHECK_ENABLED=false
          echo "IPA outputs:"
          find build/ios -name "*.ipa" -type f
          test -n "$(find build/ios -name '*.ipa' -type f | head -1)" \
            || (echo "ERROR: No .ipa after flutter build ipa" && exit 1)

          echo "=== Iris_InitDartApiDL IPA gate ==="
          IPA=$(find build/ios -name "*.ipa" -type f | head -1)
          GATE_DIR=$(mktemp -d)
          unzip -q "$IPA" -d "$GATE_DIR"
          APP_DIR=$(find "$GATE_DIR" -name "*.app" -type d | head -1)
          test -n "$APP_DIR" || (echo "ERROR: No .app inside IPA" && exit 1)
          NM_BIN=$(command -v llvm-nm || command -v nm)
          FOUND=0
          # Search Runner binary + embedded frameworks for Iris FFI symbol.
          while IFS= read -r -d '' BIN; do
            if "$NM_BIN" -gU "$BIN" 2>/dev/null | grep -E 'Iris_InitDartApiDL|\bInitDartApiDL\b' >/dev/null; then
              echo "FOUND Iris symbol in: $BIN"
              FOUND=1
            fi
          done < <(find "$APP_DIR" -type f \( -perm -111 -o -name "*.dylib" -o -name "AgoraRtcKit" -o -name "AgoraRtcWrapper" -o -name "iris_method_channel" -o -name "Runner" \) -print0)
          # Also scan all Mach-O files under Frameworks/
          if [[ -d "$APP_DIR/Frameworks" ]]; then
            while IFS= read -r -d '' BIN; do
              if file "$BIN" 2>/dev/null | grep -q 'Mach-O'; then
                if "$NM_BIN" -gU "$BIN" 2>/dev/null | grep -E 'Iris_InitDartApiDL|\bInitDartApiDL\b' >/dev/null; then
                  echo "FOUND Iris symbol in: $BIN"
                  FOUND=1
                fi
              fi
            done < <(find "$APP_DIR/Frameworks" -type f -print0)
          fi
          # Check main executable
          EXEC="$APP_DIR/Runner"
          if [[ -f "$EXEC" ]] && "$NM_BIN" -gU "$EXEC" 2>/dev/null | grep -E 'Iris_InitDartApiDL|\bInitDartApiDL\b' >/dev/null; then
            echo "FOUND Iris symbol in Runner executable"
            FOUND=1
          fi
          rm -rf "$GATE_DIR"
          if [[ "$FOUND" -ne 1 ]]; then
            echo "ERROR: Iris_InitDartApiDL not found in IPA — TestFlight will crash on video init"
            exit 1
          fi
          echo "Iris IPA gate PASSED"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload IPA only. Do not assign Internal Testing groups via API —
        # ASC returns: "Cannot add internal group to a build."
        # Add the build manually in TestFlight → babyland tester → Builds.
        submit_to_testflight: false

  ios-testflight-manual:
    name: Babyland iOS TestFlight (manual only)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Babyland"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thebabyland
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool"
    scripts:
      - name: Verify Firebase iOS config
        script: test -f ios/Runner/GoogleService-Info.plist
      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --custom-export-options '{"method":"app-store","destination":"export","signingStyle":"manual"}'
          cat "$HOME/export_options.plist"
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install
      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --no-tree-shake-icons \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define=API_BASE_URL=http://164.52.197.176/api/v1 \
            --dart-define=API_ROOT_URL=http://164.52.197.176/api \
            --dart-define=FIREBASE_FORCE_RECAPTCHA=false \
            --dart-define=APP_BUILD_TAG=appstore-v3 \
            --dart-define=FIREBASE_APP_CHECK_ENABLED=false
          find build/ios -name "*.ipa" -type f
          test -n "$(find build/ios -name '*.ipa' -type f | head -1)" \
            || (echo "ERROR: No .ipa after flutter build ipa" && exit 1)
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  qa-full:
    name: Babyland Full QA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        # Infos are legacy/style noise; warnings and errors still fail QA.
        script: flutter analyze --no-fatal-infos
      - name: Flutter tests (unit/widget)
        script: flutter test
      - name: Integration test suite
        script: |
          # Device/token gated: tests skip cleanly when E2E_AUTH_TOKEN is unset.
          flutter test integration_test
      - name: Doctor API contract tests (optional env-gated)
        script: |
          if [[ -n "$TEST_PATIENT_EMAIL" && -n "$TEST_PATIENT_PASSWORD" ]]; then
            flutter test test/doctor_api_test.dart --timeout 180s
          else
            echo "Skipping doctor_api_test.dart: TEST_PATIENT_EMAIL / TEST_PATIENT_PASSWORD not set."
          fi
