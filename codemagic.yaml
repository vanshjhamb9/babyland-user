# Babyland — iOS TestFlight / App Store builds on Codemagic (no Mac required).
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# One-time Codemagic setup (web UI):
# 1. Sign up at https://codemagic.io and connect this Git repository.
# 2. Team settings → Integrations → Apple Developer Portal → connect your account.
# 3. Team settings → Integrations → App Store Connect → add API key (.p8).
# 4. Create a Codemagic application → select workflow "ios-testflight".
# 5. Start build. Codemagic creates signing certs/profiles for com.thebabyland automatically.

workflows:
  ios-testflight:
    name: Babyland iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thebabyland
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
          branch_patterns:
            - pattern: main
              include: true
            - pattern: master
              include: true
      cancel_previous_builds: true

    scripts:
      - name: Verify Firebase iOS config
        script: |
          test -f ios/Runner/GoogleService-Info.plist || (
            echo "Missing ios/Runner/GoogleService-Info.plist"
            exit 1
          )

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Flutter packages
        script: flutter pub get

      - name: CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --no-tree-shake-icons \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=API_BASE_URL=http://164.52.197.176/api/v1 \
            --dart-define=API_ROOT_URL=http://164.52.197.176/api \
            --dart-define=FIREBASE_FORCE_RECAPTCHA=false \
            --dart-define=APP_BUILD_TAG=appstore-v1 \
            --dart-define=FIREBASE_APP_CHECK_ENABLED=false

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - $CM_EMAIL
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  ios-testflight-manual:
    name: Babyland iOS TestFlight (manual only)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thebabyland
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Verify Firebase iOS config
        script: test -f ios/Runner/GoogleService-Info.plist
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: cd ios && pod install
      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --no-tree-shake-icons \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=API_BASE_URL=http://164.52.197.176/api/v1 \
            --dart-define=API_ROOT_URL=http://164.52.197.176/api \
            --dart-define=FIREBASE_FORCE_RECAPTCHA=false \
            --dart-define=APP_BUILD_TAG=appstore-v1 \
            --dart-define=FIREBASE_APP_CHECK_ENABLED=false

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
