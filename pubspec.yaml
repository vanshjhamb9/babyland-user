name: babyland
description: "A new Flutter project."
#flutter_windows_3:35:4:
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1
  shimmer: ^3.0.0
  provider: ^6.1.5+1
  pinput: ^5.0.2
  device_preview: ^1.3.1
  table_calendar: ^3.2.0
  dropdown_button2:
  image_picker: ^1.2.0
  intl: ^0.20.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  googleapis_auth: ^2.0.0
  file_picker: ^10.3.3
  googleapis: ^15.0.0
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  firebase_app_check: ^0.4.3
  firebase_messaging: ^16.0.3
  flutter_dotenv: ^6.0.0
  hive_flutter: ^1.1.0
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  flutter_spinkit: ^5.2.2
  speech_to_text: ^7.3.0
  record: ^6.1.1
  flutter_html: ^3.0.0
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  agora_rtc_engine: ^6.5.2
  permission_handler: ^12.0.0+1
  fl_chart: ^1.2.0
  webview_flutter: ^4.10.0

  # AI Chat — TTS & Streaming
  flutter_tts: ^4.2.0

  # Push Notifications — Local
  flutter_local_notifications: ^18.0.1

  # Analytics & Crashlytics
  firebase_analytics: ^12.1.3
  firebase_crashlytics: ^5.0.8

  # Connectivity
  connectivity_plus: ^6.1.3

  # UUID for session/trace IDs
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  test: ^1.30.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/.env

  fonts:
    - family: GilroyUltraLight
      fonts:
        - asset: assets/fonts/Gilroy-UltraLight.ttf
    - family: GilroyThin
      fonts:
        - asset: assets/fonts/Gilroy-Thin.ttf
    - family: GilroyLight
      fonts:
        - asset: assets/fonts/Gilroy-Light.ttf
    - family: GilroyRegular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
    - family: GilroyMedium
      fonts:
        - asset: assets/fonts/Gilroy-Medium.ttf
    - family: GilroySemiBold
      fonts:
        - asset: assets/fonts/Gilroy-SemiBold.ttf
    - family: GilroyBold
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
    - family: GilroyExtraBold
      fonts:
        - asset: assets/fonts/Gilroy-ExtraBold.ttf
    - family: GilroyHeavy
      fonts:
        - asset: assets/fonts/Gilroy-Heavy.ttf
    - family: GilroyBlack
      fonts:
        - asset: assets/fonts/Gilroy-Black.ttf
